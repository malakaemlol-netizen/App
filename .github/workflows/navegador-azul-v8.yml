                      }
                      clipLink = t
                      clipChip.removeAllViews()
                      clipChip.addView(siteIcon(t, 38), LinearLayout.LayoutParams(dp(38), dp(38)))
                      val col = LinearLayout(this)
                      col.orientation = LinearLayout.VERTICAL
                      col.setPadding(dp(12), 0, 0, 0)
                      col.addView(text("Abrir link copiado", 14f, ink, true))
