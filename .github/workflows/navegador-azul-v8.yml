                  user = name
                  histCache = null
                  favCache = null
                  dlCache = null
                  buildUi()
                  val act = intent?.action
                  val data = intent?.dataString
                  setIntent(Intent())
                  newTab(act == ACTION_NEW_INCOG, data)
              }

