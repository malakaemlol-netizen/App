              // ---- tradução de sites (Google Tradutor, sem instalar nada)
              private fun tLang() = prefs.getString("tlang", "pt") ?: "pt"

              private fun autoTr() = prefs.getBoolean("autotr", false)

              private fun langName(code: String) = langs.firstOrNull { it.first == code }?.second ?: "Português"

              private fun translateUrl(u: String): String? {
                  val uri = try { Uri.parse(u) } catch (e: Exception) { return null }
                  val sch = uri.scheme ?: return null
                  val host = uri.host ?: return null
                  if (sch != "https" && sch != "http") return null
                  if (uri.port != -1) return null
                  val h = host.lowercase()
                  if (h.endsWith(".translate.goog") || h.endsWith(".local") || h.contains("google.") ||
                      h.contains("duckduckgo.com") || h.contains("bing.com") || h.contains("youtube.com")
                  ) return null
                  val th = host.replace("-", "--").replace(".", "-") + ".translate.goog"
                  val lang = tLang()
                  val q = uri.encodedQuery
                  val frag = uri.encodedFragment
                  return "https://" + th + (uri.encodedPath ?: "/") + "?" + (if (q != null) q + "&" else "") +
                      "_x_tr_sl=auto&_x_tr_tl=" + lang + "&_x_tr_hl=" + lang + "&_x_tr_pto=wapp" +
                      (if (frag != null) "#" + frag else "")
              }

              private fun isTranslated(u: String?) = u != null && Uri.parse(u).host?.endsWith(".translate.goog") == true

              private fun originalUrl(u: String): String? {
                  val uri = Uri.parse(u)
                  val host = uri.host ?: return null
                  if (!host.endsWith(".translate.goog")) return null
                  val oh = host.removeSuffix(".translate.goog").replace("--", "\u0001").replace("-", ".").replace("\u0001", "-")
                  val q = (uri.encodedQuery ?: "").split("&").filter { it.isNotEmpty() && !it.startsWith("_x_tr_") }.joinToString("&")
                  return "https://" + oh + (uri.encodedPath ?: "/") + (if (q.isNotEmpty()) "?" + q else "")
              }

