              // ---------------------------------------------------------------- listas (histórico, favoritos)

              private var histCache: MutableList<Hist>? = null
              private var favCache: MutableList<Hist>? = null
              private var dlCache: MutableList<Dl>? = null

              private fun readList(key: String): MutableList<Hist> {
                  val out = mutableListOf<Hist>()
                  try {
                      val arr = JSONArray(prefs.getString(key, "[]"))
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          out.add(Hist(o.getString("t"), o.getString("u")))
                      }
                  } catch (e: Exception) {
                  }
                  return out
              }

              private fun writeList(key: String, l: List<Hist>, max: Int) {
                  val arr = JSONArray()
                  for (h in l.take(max)) arr.put(JSONObject().put("t", h.title).put("u", h.url))
                  prefs.edit().putString(key, arr.toString()).apply()
              }

              private fun history(): MutableList<Hist> {
                  histCache?.let { return it }
                  val l = readList("hist_$user")
                  histCache = l
                  return l
              }

              private fun saveHistory() {
                  val key = "hist_$user"
                  val copy = ArrayList<Hist>(history())
                  Thread { writeList(key, copy, 300) }.start()
              }

              private fun addHistory(title: String, url: String) {
                  val l = history()
                  if (l.isNotEmpty() && l[0].url == url) return
                  l.add(0, Hist(title, url))
                  if (l.size > 300) l.removeAt(l.size - 1)
                  saveHistory()
              }

              private fun favs(): MutableList<Hist> {
                  favCache?.let { return it }
                  val l = readList("fav_$user")
                  favCache = l
                  return l
              }

              private fun saveFavs() {
                  writeList("fav_$user", favs(), 200)
              }

              private fun toggleFav(t: Tab) {
                  val u = shownUrl(t.web.url)
                  if (u == null || isHome(u) || u.startsWith("data:")) {
                      toast("Abra um site primeiro")
                      return
                  }
                  val l = favs()
                  val ex = l.firstOrNull { it.url == u }
                  if (ex != null) {
                      l.remove(ex)
                      toast("Removido dos favoritos")
                  } else {
                      val title = t.web.title?.takeIf { it.isNotBlank() } ?: u
                      l.add(0, Hist(title, u))
                      toast("Adicionado aos favoritos")
                  }
                  saveFavs()
              }

              private fun showHistory() {
                  listSheet("Histórico", "Nenhum site visitado ainda.", R.drawable.ic_history, history(),
                      "Apagar todo o histórico?") { saveHistory() }
              }

              private fun showFavs() {
                  listSheet("Favoritos", "Nenhum favorito ainda. Use o menu para adicionar.", R.drawable.ic_star, favs(),
                      "Apagar todos os favoritos?") { saveFavs() }
              }

              private fun listSheet(
                  heading: String, empty: String, res: Int, items: MutableList<Hist>,
                  clearMsg: String, onChange: () -> Unit
              ) {
                  sheet { box, close ->
                      val head = LinearLayout(this)
                      head.orientation = LinearLayout.HORIZONTAL
                      head.gravity = Gravity.CENTER_VERTICAL
                      head.addView(text(heading, 20f, ink, true), LinearLayout.LayoutParams(0, WRAP, 1f))
                      val list = LinearLayout(this)
                      list.orientation = LinearLayout.VERTICAL

                      fun fill() {
                          list.removeAllViews()
                          if (items.isEmpty()) {
                              list.addView(text(empty, 15f, muted), lp(MATCH, WRAP, 20))
                          }
                          for (h in items.take(200)) {
                              val r = LinearLayout(this)
                              r.orientation = LinearLayout.HORIZONTAL
                              r.gravity = Gravity.CENTER_VERTICAL
                              r.setPadding(dp(8), dp(6), dp(0), dp(6))
                              r.addView(siteIcon(h.url, 42), LinearLayout.LayoutParams(dp(42), dp(42)))
                              val col = LinearLayout(this)
                              col.orientation = LinearLayout.VERTICAL
                              col.setPadding(dp(14), 0, dp(8), 0)
                              val t1 = text(if (h.title.isBlank()) h.url else h.title, 15f, ink)
                              t1.maxLines = 1
                              t1.ellipsize = TextUtils.TruncateAt.END
                              val t2 = text(hostOf(h.url), 12f, muted)
                              t2.maxLines = 1
                              t2.ellipsize = TextUtils.TruncateAt.END
                              col.addView(t1)
                              col.addView(t2)
                              r.addView(col, LinearLayout.LayoutParams(0, WRAP, 1f))
                              val x = icon(R.drawable.ic_close, muted)
                              x.setPadding(dp(12), dp(12), dp(12), dp(12))
                              x.contentDescription = "Apagar"
                              x.setOnClickListener {
                                  items.remove(h)
                                  onChange()
                                  fill()
                              }
                              r.addView(x, LinearLayout.LayoutParams(dp(44), dp(44)))
                              pressFx(r, 0.98f)
                              r.setOnClickListener {
                                  close()
                                  tabs[cur].failedUrl = null
                                  tabs[cur].web.loadUrl(h.url)
                              }
                              list.addView(r)
                          }
                      }

                      val clear = pill("Apagar tudo", light, dark, R.drawable.ic_delete) {
                          AlertDialog.Builder(this)
                              .setMessage(clearMsg)
                              .setPositiveButton("Apagar") { _, _ ->
                                  items.clear()
                                  onChange()
                                  fill()
                                  toast("Apagado")
                              }
                              .setNegativeButton("Cancelar", null)
                              .show()
                      }
                      head.addView(clear, LinearLayout.LayoutParams(WRAP, dp(40)))
                      box.addView(head)
                      box.addView(list, lp(MATCH, WRAP, 8))
                      fill()
                  }
              }

