              private fun showClipChip() {
                  try {
                      val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                      val t = cm.primaryClip?.getItemAt(0)?.coerceToText(this)?.toString()?.trim()
                      if (t == null || !(t.startsWith("http://") || t.startsWith("https://")) || t.contains(" ")) {
                          hideClip()
                          return
                      }
                      if (t == shownUrl(tabs.getOrNull(cur)?.web?.url)) {
                          hideClip()
