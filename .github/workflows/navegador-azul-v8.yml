              private fun ago(pub: String): String =
                  try {
                      val d = SimpleDateFormat("EEE, dd MMM yyyy HH:mm:ss zzz", Locale.US).parse(pub)
                      val m = ((System.currentTimeMillis() - (d?.time ?: 0L)) / 60000).toInt()
                      when {
                          m < 1 -> "agora"
                          m < 60 -> "há $m min"
                          m < 1440 -> "há ${m / 60} h"
                          else -> "há ${m / 1440} d"
                      }
                  } catch (e: Exception) {
                      ""
                  }

              private fun parseNews(xml: String): List<News> {
                  val out = mutableListOf<News>()
                  val opt = RegexOption.DOT_MATCHES_ALL
                  for (m in Regex("<item>(.*?)</item>", opt).findAll(xml)) {
                      val b = m.groupValues[1]
                      val t0 = Regex("<title>(.*?)</title>", opt).find(b)?.groupValues?.get(1) ?: continue
                      val link = Regex("<link>(.*?)</link>", opt).find(b)?.groupValues?.get(1)?.trim() ?: continue
                      val src = plain(Regex("<source[^>]*>(.*?)</source>", opt).find(b)?.groupValues?.get(1) ?: "")
                      val pub = Regex("<pubDate>(.*?)</pubDate>", opt).find(b)?.groupValues?.get(1) ?: ""
                      var title = plain(t0.replace("<![CDATA[", "").replace("]]>", ""))
                      if (src.isNotEmpty() && title.endsWith(" - " + src)) title = title.removeSuffix(" - " + src)
                      out.add(News(title, src, link.replace("&amp;", "&"), ago(pub)))
                      if (out.size >= 15) break
                  }
                  return out
              }

              private fun newsBlock(): String {
                  val cat = curCat()
                  fun e(s: String) = TextUtils.htmlEncode(s)
                  val sb = StringBuilder()
                  sb.append("<div class='nh'>Notícias<a class='rf' href='azul://news?c=" + cat + "&r=1'>&#8635;</a></div><div class='chips'>")
                  newsCats.forEachIndexed { i, c ->
                      sb.append("<a" + (if (i == cat) " class='on'" else "") + " href='azul://news?c=" + i + "'>" + c.first + "</a>")
                  }
                  sb.append("</div>")
                  val mine = topics()
                  sb.append(
                      "<a class='tp' href='azul://topic'><i>+</i><div><b>Crie seus tópicos</b><small>" +
                          (if (mine.isEmpty()) "Siga o que você gosta e receba novidades diárias" else "Seguindo: " + e(mine.joinToString(", "))) +
                          "</small></div></a>"
                  )
                  val list = newsCache[cat]
                  if (list == null || list.isEmpty()) {
                      sb.append(
                          if (newsFailed.contains(cat)) "<p class='em'>Não consegui carregar. Toque no botão de atualizar.</p>"
                          else "<p class='em'>Carregando notícias...</p>"
                      )
                  } else {
                      for (n in list) {
                          val src = if (n.source.isEmpty()) hostOf(n.url) else n.source
                          val on = mine.any { it.equals(src, true) }
                          sb.append("<div class='c'><div class='ch'><i>" + e(src.take(1).uppercase()) +
                              "<img src='https://www.google.com/s2/favicons?domain=" + e(hostOf(n.url)) + "&amp;sz=64' onerror='this.remove()'></i><span>" +
                              e(src) + "</span><a class='fl" + (if (on) " on" else "") + "' href='azul://follow?s=" + Uri.encode(src) + "'>" +
                              (if (on) "Seguindo" else "+ Seguir") + "</a></div>")
                          sb.append("<a class='ct' href='" + e(n.url) + "'><b>" + e(n.title) + "</b>" +
                              (if (n.img.isNotEmpty()) "<img src='" + e(n.img) + "' onerror='this.remove()'>" else "") + "</a>")
                          sb.append("<div class='cf'><span>" + e(n.time) + "</span><a href='" + e(n.url) + "'>Ler matéria &#8250;</a></div></div>")
                      }
                  }
                  return sb.toString()
              }

              private fun pushNews(tab: Tab) {
                  val js = "var e=document.getElementById('news');if(e){e.innerHTML=" + JSONObject.quote(newsBlock()) + ";}"
                  try {
                      tab.web.evaluateJavascript(js, null)
                  } catch (e: Exception) {
                  }
              }

              private fun loadNews(tab: Tab, force: Boolean) {
                  val cat = curCat()
                  val old = newsTime[cat] ?: 0L
                  if (!force && newsCache[cat] != null && System.currentTimeMillis() - old < 10 * 60 * 1000L) return
                  searchPool.execute {
                      val bx = httpGet(bingUrl(cat))
                      var list = if (bx != null) parseBing(bx) else emptyList()
                      if (list.isEmpty()) {
                          val xml = httpGet(newsUrl(cat))
                          list = if (xml != null) parseNews(xml) else emptyList()
                      }
                      runOnUiThread {
                          if (list.isNotEmpty()) {
                              newsCache[cat] = list
                              newsTime[cat] = System.currentTimeMillis()
                              newsFailed.remove(cat)
                          } else {
                              newsFailed.add(cat)
                          }
                          if (tabs.contains(tab) && curCat() == cat && tab.web.url?.contains("home.local") == true) {
                              tab.web.postDelayed({ pushNews(tab) }, 250)
                          }
                      }
                  }
              }

