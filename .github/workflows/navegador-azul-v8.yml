              compileSdk = 34

              defaultConfig {
                  applicationId = "com.azul.navegador"
                  // 21 = Android 5.0: funciona em celulares antigos e nos novos
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 8
                  versionName = "8.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
