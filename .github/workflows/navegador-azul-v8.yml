                      box.addView(title)
                      val list = LinearLayout(this)
                      list.orientation = LinearLayout.VERTICAL

                      fun fill() {
                          list.removeAllViews()
                          title.text = "Janelas (" + tabs.size + ")"
                          tabs.forEachIndexed { i, t ->
                              val r = LinearLayout(this)
                              r.orientation = LinearLayout.HORIZONTAL
                              r.gravity = Gravity.CENTER_VERTICAL
                              r.setPadding(dp(12), dp(6), dp(0), dp(6))
                              r.background = if (i == cur) round(light, 16) else null
                              val tint = if (t.incognito) incogColor else blue
                              r.addView(
                                  icon(if (t.incognito) R.drawable.ic_incognito else R.drawable.ic_public, tint),
                                  LinearLayout.LayoutParams(dp(24), dp(24))
                              )
                              val col = LinearLayout(this)
                              col.orientation = LinearLayout.VERTICAL
                              col.setPadding(dp(14), 0, dp(8), 0)
                              val n = t.web.title?.takeIf { it.isNotBlank() && it != "about:blank" && !it.contains("home.local") }
                                  ?: "Nova janela"
                              val t1 = text(n, 15f, ink, i == cur)
                              t1.maxLines = 1
                              t1.ellipsize = TextUtils.TruncateAt.END
                              col.addView(t1)
                              val u = shownUrl(t.web.url)
                              if (!isHome(u) && u != null && !u.startsWith("data:")) {
                                  val t2 = text(u, 12f, muted)
                                  t2.maxLines = 1
                                  t2.ellipsize = TextUtils.TruncateAt.END
                                  col.addView(t2)
                              }
                              r.addView(col, LinearLayout.LayoutParams(0, WRAP, 1f))
                              val x = icon(R.drawable.ic_close, muted)
                              x.setPadding(dp(12), dp(12), dp(12), dp(12))
                              x.contentDescription = "Fechar janela"
                              x.setOnClickListener {
                                  closeTab(i)
                                  fill()
                              }
                              r.addView(x, LinearLayout.LayoutParams(dp(48), dp(48)))
                              pressFx(r, 0.98f)
                              r.setOnClickListener {
                                  select(i)
                                  close()
                              }
                              list.addView(r, lp(MATCH, WRAP, 4))
                          }
                      }
                      box.addView(list, lp(MATCH, WRAP, 8))
                      fill()

                      val btns = LinearLayout(this)
                      btns.orientation = LinearLayout.HORIZONTAL
                      val a = pill("Nova", blue, Color.WHITE, R.drawable.ic_add) {
                          close()
                          newTab(false)
                      }
                      val b = pill("Anônima", incogColor, Color.WHITE, R.drawable.ic_incognito) {
                          close()
                          newTab(true)
                      }
                      val pa = LinearLayout.LayoutParams(0, dp(50), 1f)
                      pa.rightMargin = dp(6)
                      val pb = LinearLayout.LayoutParams(0, dp(50), 1f)
                      pb.leftMargin = dp(6)
                      btns.addView(a, pa)
                      btns.addView(b, pb)
                      box.addView(btns, lp(MATCH, WRAP, 14))
                  }
              }

              private fun showMenu() {
                  val t = tabs[cur]
                  val cu = shownUrl(t.web.url)
                  val faved = cu != null && favs().any { it.url == cu }
                  sheet { box, close ->
                      val head = LinearLayout(this)
                      head.orientation = LinearLayout.HORIZONTAL
                      head.gravity = Gravity.CENTER_VERTICAL
                      head.addView(avatar(user, 44, blue, Color.WHITE), LinearLayout.LayoutParams(dp(44), dp(44)))
                      val col = LinearLayout(this)
                      col.orientation = LinearLayout.VERTICAL
                      col.setPadding(dp(14), 0, 0, 0)
                      col.addView(text(user, 17f, ink, true))
                      col.addView(text("Conta atual", 12f, muted))
                      head.addView(col, LinearLayout.LayoutParams(0, WRAP, 1f))
                      val gear = icon(R.drawable.ic_settings, blue)
                      gear.setPadding(dp(10), dp(10), dp(10), dp(10))
                      pressFx(gear, 0.85f)
                      gear.setOnClickListener {
                          close()
                          showSettings()
                      }
                      head.addView(gear, LinearLayout.LayoutParams(dp(44), dp(44)))
                      box.addView(head)

                      val modes = LinearLayout(this)
                      modes.orientation = LinearLayout.HORIZONTAL
                      val defs = listOf(
                          Triple(R.drawable.ic_phone, "Celular", 0),
                          Triple(R.drawable.ic_desktop, "Computador", 1),
                          Triple(R.drawable.ic_tablet, "Tablet", 2)
                      )
                      for ((res, name, i) in defs) {
                          val on = t.mode == i
                          val chip = LinearLayout(this)
                          chip.orientation = LinearLayout.VERTICAL
                          chip.gravity = Gravity.CENTER
                          chip.setPadding(dp(4), dp(12), dp(4), dp(12))
                          chip.background = round(if (on) blue else light, 16)
                          chip.addView(icon(res, if (on) Color.WHITE else dark), LinearLayout.LayoutParams(dp(26), dp(26)))
                          val lb = label(name, 12f, if (on) Color.WHITE else dark, on)
                          lb.setPadding(0, dp(6), 0, 0)
                          chip.addView(lb)
                          pressFx(chip, 0.95f)
                          chip.setOnClickListener {
                              t.mode = i
                              applyMode(t)
                              reloadTab(t)
                              close()
                          }
                          val p = LinearLayout.LayoutParams(0, WRAP, 1f)
                          p.setMargins(dp(3), 0, dp(3), 0)
                          modes.addView(chip, p)
                      }
                      box.addView(modes, lp(MATCH, WRAP, 16))

                      fun item(res: Int, s: String, trailing: String? = null, tint: Int = blue, act: () -> Unit) {
                          box.addView(row(res, s, trailing, tint) {
                              close()
                              act()
                          }, lp(MATCH, WRAP, 2))
                      }

                      item(R.drawable.ic_arrow_forward, "Avançar") { if (t.web.canGoForward()) t.web.goForward() }
                      item(R.drawable.ic_home, "Página inicial") { loadHome(t) }
                      item(R.drawable.ic_add, "Nova janela") { newTab(false) }
                      item(R.drawable.ic_incognito, "Nova janela anônima") { newTab(true) }
                      item(R.drawable.ic_star, if (faved) "Remover dos favoritos" else "Adicionar aos favoritos") { toggleFav(t) }
                      item(R.drawable.ic_star, "Favoritos") { showFavs() }
                      item(R.drawable.ic_download, "Downloads") { showDownloads() }
                      item(R.drawable.ic_history, "Histórico") { showHistory() }
                      item(R.drawable.ic_share, "Compartilhar página") { shareUrl(shownUrl(t.web.url)) }
                      item(R.drawable.ic_copy, "Copiar link") { copyUrl(shownUrl(t.web.url)) }
                      if (isTranslated(cu)) {
                          item(R.drawable.ic_swap, "Ver original") {
                              val o = originalUrl(cu ?: "")
                              if (o != null) t.web.loadUrl(o)
                          }
                      } else {
                          item(R.drawable.ic_public, "Traduzir página", langName(tLang())) {
                              val tu = if (cu != null) translateUrl(cu) else null
                              if (tu != null) t.web.loadUrl(tu) else toast("Não dá para traduzir esta página")
                          }
                      }
                      item(R.drawable.ic_bolt, "Modo rápido (sem imagens)", if (fast) "Ligado" else "Desligado") {
                          fast = !fast
                          prefs.edit().putBoolean("fast", fast).apply()
                          tabs.forEach {
                              applyFast(it)
                              reloadTab(it)
                          }
                          toast(if (fast) "Modo rápido ligado: sem imagens, mais leve" else "Modo rápido desligado")
                      }
                      item(R.drawable.ic_delete, "Limpar cookies e cache") {
                          CookieManager.getInstance().removeAllCookies(null)
                          WebStorage.getInstance().deleteAllData()
                          t.web.clearCache(true)
                          toast("Dados limpos")
                      }
                      item(R.drawable.ic_swap, "Trocar de conta") { logout() }
                  }
              }

              private fun linkSheet(url: String, isImage: Boolean, incog: Boolean) {
                  sheet { box, close ->
                      val tv = text(url, 13f, muted)
                      tv.maxLines = 2
                      tv.ellipsize = TextUtils.TruncateAt.END
                      box.addView(tv, lp(MATCH, WRAP, 0))
                      fun item(res: Int, s: String, act: () -> Unit) {
                          box.addView(row(res, s, null, blue) {
                              close()
                              act()
                          }, lp(MATCH, WRAP, 4))
                      }
                      item(R.drawable.ic_add, if (isImage) "Abrir imagem em nova janela" else "Abrir em nova janela") {
                          newTab(incog, url)
                      }
                      item(R.drawable.ic_copy, "Copiar link") { copyUrl(url) }
                      item(R.drawable.ic_share, "Compartilhar") { shareUrl(url) }
                      if (isImage) {
                          item(R.drawable.ic_download, "Baixar imagem") { download(url, null, null, null, incog) }
                      }
                  }
              }

              private fun shareUrl(u: String?) {
                  if (u == null || isHome(u) || u.startsWith("data:")) {
                      toast("Abra um site primeiro")
                      return
                  }
                  try {
                      val i = Intent(Intent.ACTION_SEND)
                      i.type = "text/plain"
                      i.putExtra(Intent.EXTRA_TEXT, u)
                      startActivity(Intent.createChooser(i, "Compartilhar"))
                  } catch (e: Exception) {
                  }
              }

              private fun copyUrl(u: String?) {
                  if (u == null || isHome(u) || u.startsWith("data:")) {
                      toast("Abra um site primeiro")
                      return
                  }
                  val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("link", u))
                  toast("Link copiado")
              }

              // ---------------------------------------------------------------- downloads

              private val dlReceiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) {
                      val id = i?.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L) ?: -1L
                      val d = downloads().firstOrNull { it.id == id } ?: return
                      val st = dlState(id)
                      if (st.exists && st.status == DownloadManager.STATUS_SUCCESSFUL) {
                          toast("Download concluído: " + d.name)
                      } else {
                          toast("Falha no download: " + d.name)
                      }
                  }
              }

              private fun downloads(): MutableList<Dl> {
                  dlCache?.let { return it }
                  val out = mutableListOf<Dl>()
                  try {
                      val arr = JSONArray(prefs.getString("dl_$user", "[]"))
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          out.add(Dl(o.getLong("i"), o.getString("n"), o.getString("u"), o.getLong("t")))
                      }
                  } catch (e: Exception) {
                  }
                  dlCache = out
                  return out
              }

              private fun saveDownloads() {
                  val arr = JSONArray()
                  for (d in downloads().take(200)) {
                      arr.put(JSONObject().put("i", d.id).put("n", d.name).put("u", d.url).put("t", d.time))
                  }
                  prefs.edit().putString("dl_$user", arr.toString()).apply()
              }

              private fun dlState(id: Long): DlState {
                  var c: android.database.Cursor? = null
                  try {
                      val dm = getSystemService(DOWNLOAD_SERVICE) as DownloadManager
                      c = dm.query(DownloadManager.Query().setFilterById(id))
                      if (c != null && c.moveToFirst()) {
                          val st = c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS))
                          val done = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR))
                          val total = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES))
                          return DlState(st, done, total, true)
                      }
                  } catch (e: Exception) {
                  } finally {
                      c?.close()
                  }
                  return DlState(0, 0L, 0L, false)
              }

              private fun dlStatus(d: Dl): String {
                  val s = dlState(d.id)
                  if (!s.exists) return "Arquivo removido"
                  return when (s.status) {
                      DownloadManager.STATUS_SUCCESSFUL ->
                          "Concluído · " + Formatter.formatShortFileSize(this, maxOf(s.total, s.done))
                      DownloadManager.STATUS_FAILED -> "Falhou"
                      DownloadManager.STATUS_RUNNING ->
                          if (s.total > 0) "Baixando… " + (s.done * 100 / s.total) + "%" else "Baixando…"
                      else -> "Aguardando…"
                  }
              }

              private fun openDownload(id: Long) {
                  try {
                      val dm = getSystemService(DOWNLOAD_SERVICE) as DownloadManager
                      val uri = dm.getUriForDownloadedFile(id)
                      if (uri == null) {
                          toast("Arquivo não encontrado")
                          return
                      }
                      val mime = dm.getMimeTypeForDownloadedFile(id) ?: "*/*"
                      val i = Intent(Intent.ACTION_VIEW)
                      i.setDataAndType(uri, mime)
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(i)
                  } catch (e: Exception) {
                      toast("Nenhum app para abrir este arquivo")
                  }
              }

              private fun showDownloads() {
                  val l = downloads()
                  sheet { box, close ->
                      val head = LinearLayout(this)
                      head.orientation = LinearLayout.HORIZONTAL
                      head.gravity = Gravity.CENTER_VERTICAL
                      head.addView(text("Downloads", 20f, ink, true), LinearLayout.LayoutParams(0, WRAP, 1f))
                      val list = LinearLayout(this)
                      list.orientation = LinearLayout.VERTICAL
                      val labels = mutableListOf<Pair<Dl, TextView>>()

                      fun refresh() {
                          for ((d, tv) in labels) tv.text = dlStatus(d)
                      }

                      fun fill() {
                          list.removeAllViews()
                          labels.clear()
                          if (l.isEmpty()) {
                              list.addView(text("Nenhum download ainda.", 15f, muted), lp(MATCH, WRAP, 20))
                          }
                          for (d in l.take(100)) {
                              val r = LinearLayout(this)
                              r.orientation = LinearLayout.HORIZONTAL
                              r.gravity = Gravity.CENTER_VERTICAL
                              r.setPadding(dp(8), dp(6), dp(0), dp(6))
                              r.addView(icon(R.drawable.ic_download, blue), LinearLayout.LayoutParams(dp(22), dp(22)))
                              val col = LinearLayout(this)
                              col.orientation = LinearLayout.VERTICAL
                              col.setPadding(dp(14), 0, dp(8), 0)
                              val t1 = text(d.name, 15f, ink)
                              t1.maxLines = 1
                              t1.ellipsize = TextUtils.TruncateAt.END
                              val t2 = text(dlStatus(d), 12f, muted)
                              labels.add(Pair(d, t2))
                              col.addView(t1)
                              col.addView(t2)
                              r.addView(col, LinearLayout.LayoutParams(0, WRAP, 1f))
                              val x = icon(R.drawable.ic_close, muted)
                              x.setPadding(dp(12), dp(12), dp(12), dp(12))
                              x.contentDescription = "Remover da lista"
                              x.setOnClickListener {
                                  l.remove(d)
                                  saveDownloads()
                                  fill()
                              }
                              r.addView(x, LinearLayout.LayoutParams(dp(44), dp(44)))
                              pressFx(r, 0.98f)
                              r.setOnClickListener {
                                  val s = dlState(d.id)
                                  if (s.exists && s.status == DownloadManager.STATUS_SUCCESSFUL) {
                                      close()
                                      openDownload(d.id)
                                  } else {
                                      toast(dlStatus(d))
                                  }
                              }
                              list.addView(r)
                          }
                      }

                      val clear = pill("Limpar lista", light, dark, R.drawable.ic_delete) {
                          l.clear()
                          saveDownloads()
                          fill()
                          toast("Lista limpa (os arquivos continuam no celular)")
                      }
                      head.addView(clear, LinearLayout.LayoutParams(WRAP, dp(40)))
                      box.addView(head)
                      box.addView(list, lp(MATCH, WRAP, 8))
                      fill()

                      val runner = object : Runnable {
                          override fun run() {
                              if (!list.isAttachedToWindow) return
                              refresh()
                              list.postDelayed(this, 1000)
                          }
                      }
                      list.postDelayed(runner, 1000)
                  }
              }

              private fun download(url: String, ua: String?, cd: String?, mime: String?, incog: Boolean) {
                  val d = PendingDl(url, ua, cd, mime, incog)
                  if (Build.VERSION.SDK_INT in 23..28 &&
                      checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED
                  ) {
                      pendingDl = d
                      requestPermissions(arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE), REQ_STORAGE)
                  } else {
                      startDownload(d)
                  }
              }

              private fun startDownload(d: PendingDl) {
                  try {
                      val r = DownloadManager.Request(Uri.parse(d.url))
                      if (d.mime != null) r.setMimeType(d.mime)
                      if (d.ua != null) r.addRequestHeader("User-Agent", d.ua)
                      val cookie = CookieManager.getInstance().getCookie(d.url)
                      if (cookie != null) r.addRequestHeader("Cookie", cookie)
                      val name = URLUtil.guessFileName(d.url, d.cd, d.mime)
                      r.setTitle(name)
                      r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                      r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name)
                      val id = (getSystemService(DOWNLOAD_SERVICE) as DownloadManager).enqueue(r)
                      if (!d.incog) {
                          downloads().add(0, Dl(id, name, d.url, System.currentTimeMillis()))
                          saveDownloads()
                      }
                      toast("Baixando…")
                  } catch (e: Exception) {
                      toast("Não foi possível baixar")
                  }
              }
          }
          FIM_ARQUIVO_28

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleRelease --no-daemon

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk NavegadorAzul.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Navegador Azul v${{ github.run_number }}
          files: NavegadorAzul.apk
