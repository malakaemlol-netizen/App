              }

              // ---------------------------------------------------------------- foto (ícone) dos sites

              private fun faviconInto(host: String, iv: ImageView, done: (() -> Unit)? = null) {
                  val h = host.removePrefix("www.")
                  iv.tag = h
                  val cached = favMem[h]
                  if (cached != null) {
                      iv.setImageBitmap(cached)
                      done?.invoke()
                      return
                  }
                  iconPool.execute {
                      var bmp: Bitmap? = null
                      try {
                          val f = File(cacheDir, "fav_" + h.replace(Regex("[^A-Za-z0-9.]"), "_") + ".png")
                          if (f.exists()) bmp = BitmapFactory.decodeFile(f.path)
                          if (bmp == null) {
                              val c = URL("https://www.google.com/s2/favicons?domain=" + Uri.encode(h) + "&sz=128").openConnection() as HttpURLConnection
                              c.connectTimeout = 6000
                              c.readTimeout = 6000
                              val b = BitmapFactory.decodeStream(c.inputStream)
                              if (b != null) {
                                  FileOutputStream(f).use { out -> b.compress(Bitmap.CompressFormat.PNG, 100, out) }
                                  bmp = b
                              }
                          }
                      } catch (e: Exception) {
                      }
                      val res = bmp
                      if (res != null) {
                          favMem[h] = res
                          runOnUiThread {
                              if (iv.tag == h) {
                                  iv.setImageBitmap(res)
                                  done?.invoke()
                              }
                          }
                      }
                  }
              }

              private fun siteIcon(url: String, size: Int): FrameLayout {
                  val host = hostOf(url)
                  val box = FrameLayout(this)
                  box.background = round(light, size / 2)
                  val letter = label(host.take(1).uppercase().ifEmpty { "?" }, size / 2.4f, dark, true)
                  box.addView(letter, FrameLayout.LayoutParams(MATCH, MATCH))
                  val iv = ImageView(this)
                  iv.scaleType = ImageView.ScaleType.FIT_CENTER
                  val pad = dp(size / 4)
                  iv.setPadding(pad, pad, pad, pad)
                  box.addView(iv, FrameLayout.LayoutParams(MATCH, MATCH))
                  if (host.contains(".")) faviconInto(host, iv) { letter.visibility = View.GONE }
                  return box
              }

