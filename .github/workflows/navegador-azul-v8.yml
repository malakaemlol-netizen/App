              // ---------------------------------------------------------------- pesquisa em cards

              private fun isSearch(url: String?) = url != null && url.contains("busca.local")

              private fun queryOf(url: String?): String =
                  try {
                      Uri.parse(url).getQueryParameter("q") ?: ""
                  } catch (e: Exception) {
                      ""
                  }

              private fun hostOf(u: String): String =
                  try {
                      (Uri.parse(u).host ?: u).removePrefix("www.")
                  } catch (e: Exception) {
                      u
                  }

              private fun httpGet(u: String): String? =
                  try {
                      val c = URL(u).openConnection() as HttpURLConnection
                      c.connectTimeout = 8000
                      c.readTimeout = 10000
                      c.setRequestProperty("User-Agent", mobileUA)
                      c.setRequestProperty("Accept-Language", "pt-BR,pt;q=0.9,en;q=0.5")
                      c.inputStream.bufferedReader().use { it.readText() }
                  } catch (e: Exception) {
                      null
                  }

              @Suppress("DEPRECATION")
              private fun plain(s: String): String =
                  android.text.Html.fromHtml(s).toString().replace("\n", " ").trim()

              private fun parseResults(html: String): List<Hit> {
                  val out = mutableListOf<Hit>()
                  val a = Regex("<a\\s+[^>]*class=\"result__a\"[^>]*>(.*?)</a>", RegexOption.DOT_MATCHES_ALL)
                  val snip = Regex("class=\"result__snippet\"[^>]*>(.*?)</(?:a|div|td)>", RegexOption.DOT_MATCHES_ALL)
                  val all = a.findAll(html).toList()
                  for ((i, m) in all.withIndex()) {
                      val tag = m.value.substringBefore(">")
                      val href = Regex("href=\"([^\"]+)\"").find(tag)?.groupValues?.get(1) ?: continue
                      var link = href.replace("&amp;", "&")
                      if (link.startsWith("//")) link = "https:" + link
                      if (link.contains("duckduckgo.com/y.js")) continue
                      val real = if (link.contains("duckduckgo.com/l/")) Uri.parse(link).getQueryParameter("uddg") else link
                      if (real == null || !real.startsWith("http")) continue
                      val end = if (i + 1 < all.size) all[i + 1].range.first else html.length
                      val chunk = html.substring(m.range.last, end)
                      val sn = snip.find(chunk)?.groupValues?.get(1) ?: ""
                      out.add(Hit(plain(m.groupValues[1]), real, plain(sn)))
                  }
                  return out
              }

              private fun fetchSuggestions(q: String): List<String> {
                  val body = httpGet("https://duckduckgo.com/ac/?type=list&kl=br-pt&q=" + Uri.encode(q)) ?: return emptyList()
                  return try {
                      val arr = JSONArray(body).getJSONArray(1)
                      (0 until arr.length()).map { arr.getString(it) }.filter { !it.equals(q, true) }.take(8)
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun runSearch(tab: Tab, raw: String) {
                  val q = raw.trim()
                  if (q.isEmpty()) return
                  tab.query = q
                  tab.failedUrl = null
                  tab.loading = true
                  if (tabs.getOrNull(cur)?.web === tab.web) {
                      setLoadingUi(true)
                      setLoadProgress(15)
                  }
                  val incog = tab.incognito
                  searchPool.execute {
                      val html = httpGet("https://html.duckduckgo.com/html/?q=" + Uri.encode(q) + "&kl=br-pt")
                      val hits = if (html != null) parseResults(html) else emptyList()
                      val sugg = if (hits.isNotEmpty()) fetchSuggestions(q) else emptyList()
                      runOnUiThread {
                          if (!tabs.contains(tab) || tab.query != q) return@runOnUiThread
                          if (hits.isEmpty()) {
                              // sem internet ou o buscador não respondeu: abre a página do buscador direto
                              tab.web.loadUrl("https://html.duckduckgo.com/html/?q=" + Uri.encode(q))
                          } else {
                              val base = "https://busca.local/?q=" + Uri.encode(q)
                              tab.web.loadDataWithBaseURL(base, resultsHtml(q, hits, sugg, incog), "text/html", "UTF-8", base)
                          }
                      }
                  }
              }

              private fun resultsHtml(q: String, hits: List<Hit>, sugg: List<String>, incog: Boolean): String {
                  val bg = if (incog) "#1C262B" else "#F4F4F4"
                  val card = if (incog) "#263238" else "#FFFFFF"
                  val fg = if (incog) "#ECEFF1" else "#1F1F1F"
                  val sub = if (incog) "#B0BEC5" else "#4D5156"
                  val icbg = if (incog) "#37474F" else "#EEF1F6"
                  val hc = if (incog) "#7DB2FF" else "#1E6FEB"
                  val terms = q.split(Regex("\\s+")).filter { it.length >= 2 }.map { TextUtils.htmlEncode(it) }
                  val rx = if (terms.isEmpty()) null else Regex("(?i)(" + terms.joinToString("|") { Regex.escape(it) } + ")")
                  fun hl(raw: String): String {
                      val e = TextUtils.htmlEncode(raw)
                      return if (rx == null) e else e.replace(rx) { "<b class=\"h\">" + it.value + "</b>" }
                  }
                  val glass = "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\"><path fill=\"#9AA0A6\" d=\"M15.5,14h-0.79l-0.28,-0.27A6.47,6.47 0 0,0 16,9.5 6.5,6.5 0 1,0 9.5,16c1.61,0 3.09,-0.59 4.23,-1.57l0.27,0.28v0.79l5,4.99L20.49,19l-4.99,-5zM9.5,14C7.01,14 5,11.99 5,9.5S7.01,5 9.5,5 14,7.01 14,9.5 11.99,14 9.5,14z\"/></svg>"
                  val chevron = "<svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" style=\"margin-left:6px\"><path fill=\"currentColor\" d=\"M7.41,8.59L12,13.17l4.59,-4.58L18,10l-6,6 -6,-6z\"/></svg>"
                  val sb = StringBuilder()
                  var n = 0
                  fun delay() = "style=\"animation-delay:" + (minOf(n, 8) * 40) + "ms\""
                  fun suggestCard() {
                      if (sugg.isEmpty()) return
                      sb.append("<div class=\"c sg\" " + delay() + "><h3>As pessoas também pesquisam</h3>")
                      sugg.forEachIndexed { i, s ->
                          val link = "azul://search?q=" + Uri.encode(s)
                          val shown = if (s.length >= q.length && s.substring(0, q.length).equals(q, true))
                              "<b class=\"h\">" + TextUtils.htmlEncode(s.substring(0, q.length)) + "</b>" + TextUtils.htmlEncode(s.substring(q.length))
                          else TextUtils.htmlEncode(s)
                          sb.append("<a class=\"r" + (if (i >= 3) " x" else "") + "\" href=\"" + link + "\"><span>" + shown + "</span>" + glass + "</a>")
                      }
                      if (sugg.size > 3) {
                          sb.append("<button class=\"more\" onclick=\"var x=document.querySelectorAll('.x');for(var i=0;i<x.length;i++)x[i].style.display='flex';this.style.display='none'\">Mostrar mais" + chevron + "</button>")
                      }
                      sb.append("</div>")
                      n++
                  }
                  hits.forEachIndexed { i, h ->
                      val host = TextUtils.htmlEncode(hostOf(h.url))
                      sb.append("<div class=\"c\" " + delay() + ">")
                      sb.append("<a class=\"b\" href=\"" + TextUtils.htmlEncode(h.url) + "\"><h3 class=\"t\">" + hl(h.title) + "</h3>")
                      if (h.snippet.isNotEmpty()) sb.append("<p class=\"s\">" + hl(h.snippet) + "</p>")
                      sb.append("</a><div class=\"f\"><span class=\"ic\"><img src=\"https://www.google.com/s2/favicons?domain=" + host + "&amp;sz=64\" onerror=\"this.style.display='none'\"></span>")
                      sb.append("<span class=\"d\">" + host + "</span><a class=\"m\" href=\"azul://menu?u=" + Uri.encode(h.url) + "\">&#8226;&#8226;&#8226;</a></div></div>")
                      n++
                      if (i == 1) suggestCard()
                  }
                  if (hits.size < 2) suggestCard()
                  return """<!DOCTYPE html><html><head><meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1"><title>${TextUtils.htmlEncode(q)} - Pesquisa</title>
              <style>
              *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
              body{margin:0;padding:14px 14px 30px;background:$bg;color:$fg;font-family:sans-serif}
              @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
              .c{background:$card;border-radius:26px;padding:22px 22px 16px;margin-bottom:14px;animation:up .35s ease both}
              .b{display:block;color:inherit;text-decoration:none}
              .t{margin:0 0 10px;font-size:19px;line-height:1.3;font-weight:700;color:$fg;word-wrap:break-word}
              .s{margin:0;font-size:15px;line-height:1.55;color:$sub;word-wrap:break-word}
              .f{display:flex;align-items:center;margin-top:16px}
              .ic{width:30px;height:30px;border-radius:50%;background:$icbg;display:flex;align-items:center;justify-content:center;margin-right:12px;overflow:hidden;flex:none}
              .ic img{width:18px;height:18px}
              .d{flex:1;min-width:0;font-size:14px;color:$sub;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
              .m{color:$sub;text-decoration:none;font-size:18px;letter-spacing:1px;padding:6px 4px 6px 12px}
              .h{color:$hc;font-weight:inherit}
