              private fun parseBing(xml: String): List<News> {
                  val out = mutableListOf<News>()
                  val opt = setOf(RegexOption.DOT_MATCHES_ALL, RegexOption.IGNORE_CASE)
                  for (m in Regex("<item>(.*?)</item>", opt).findAll(xml)) {
                      val b = m.groupValues[1]
                      val t0 = Regex("<title>(.*?)</title>", opt).find(b)?.groupValues?.get(1) ?: continue
                      var link = Regex("<link>(.*?)</link>", opt).find(b)?.groupValues?.get(1)?.trim()?.replace("&amp;", "&") ?: continue
                      if (link.contains("bing.com") && link.contains("url=")) {
                          val real = try { Uri.parse(link).getQueryParameter("url") } catch (e: Exception) { null }
                          if (!real.isNullOrBlank() && real.startsWith("http")) link = real
                      }
                      val src = plain(Regex("<News:Source>(.*?)</News:Source>", opt).find(b)?.groupValues?.get(1) ?: "")
                      val pub = Regex("<pubDate>(.*?)</pubDate>", opt).find(b)?.groupValues?.get(1) ?: ""
                      var img = (Regex("<News:Image>(.*?)</News:Image>", opt).find(b)?.groupValues?.get(1) ?: "")
                          .replace("<![CDATA[", "").replace("]]>", "").replace("&amp;", "&").trim()
                      if (img.startsWith("http:")) img = "https:" + img.substring(5)
                      if (img.contains("bing.com/th") && img.contains("?") && !img.contains("&w=")) img += "&w=800&h=450&c=7"
                      val title = plain(t0.replace("<![CDATA[", "").replace("]]>", ""))
                      out.add(News(title, src, link, ago(pub), img))
                      if (out.size >= 15) break
                  }
                  return out
              }

