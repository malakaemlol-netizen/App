                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NavegadorAzul"
          include(":app")
          FIM_ARQUIVO_0
          cat > build.gradle.kts <<'FIM_ARQUIVO_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
