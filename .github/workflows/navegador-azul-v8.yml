              private fun applyTheme(t: Tab) {
                  val inc = t.incognito
                  val bg = if (inc) incogDark else barBg
                  val fg = if (inc) Color.WHITE else ink
                  bottomBar.setBackgroundColor(bg)
                  urlPill.background = round(if (inc) incogColor else pillBg, 22)
                  urlBar.setTextColor(fg)
                  urlBar.setHintTextColor(if (inc) Color.parseColor("#B0BEC5") else muted)
                  navIcons.forEach { it.setColorFilter(fg) }
                  tabsCount.setTextColor(fg)
                  (tabsCount.background as? GradientDrawable)?.setStroke(dp(2), fg)
                  lockIcon.setColorFilter(if (inc) Color.WHITE else blue)
                  reloadBtn.setColorFilter(if (inc) Color.WHITE else blue)
                  setBars(bg, bg, !inc)
              }

              private fun updateTabsBtn() {
                  tabsCount.text = tabs.size.toString()
              }

              private fun setLoadingUi(l: Boolean) {
                  reloadBtn.setImageResource(if (l) R.drawable.ic_close else R.drawable.ic_refresh)
              }

              private fun setLoadProgress(p: Int) {
                  if (p < 100) {
                      progress.visibility = View.VISIBLE
                      ObjectAnimator.ofInt(progress, "progress", p).setDuration(160).start()
                  } else {
                      ObjectAnimator.ofInt(progress, "progress", 100).setDuration(120).start()
                      progress.postDelayed({
                          if (tabs.getOrNull(cur)?.loading != true) {
                              progress.visibility = View.INVISIBLE
                              progress.progress = 0
                          }
                      }, 250)
                  }
              }

              private fun isHome(url: String?) =
                  url == null || url.contains("home.local") || url.contains("erro.local") || url == "about:blank"

              private fun shownUrl(url: String?): String? {
                  if (url != null && url.contains("erro.local")) return tabs.getOrNull(cur)?.failedUrl
                  if (isSearch(url)) return "https://duckduckgo.com/?q=" + Uri.encode(queryOf(url))
                  return url
              }

              private fun showUrl(url: String?) {
                  if (urlBar.hasFocus()) return
                  if (isSearch(url)) {
                      urlBar.setText(queryOf(url))
                      lockIcon.setImageResource(R.drawable.ic_search)
                      return
                  }
                  val u = shownUrl(url)
                  urlBar.setText(if (u == null || u.startsWith("data:") || isHome(u)) "" else u)
                  lockIcon.setImageResource(if (u != null && u.startsWith("https")) R.drawable.ic_lock else R.drawable.ic_search)
              }

              // ---------------------------------------------------------------- janelas (abas)

              private fun createTab(incognito: Boolean): Tab {
                  val w = WebView(this)
                  val tab = Tab(w, incognito)
                  setup(tab)
                  tabs.add(tab)
                  updateTabsBtn()
                  return tab
              }

              private fun newTab(incognito: Boolean, url: String? = null) {
                  val tab = createTab(incognito)
                  select(tabs.size - 1)
                  if (url.isNullOrBlank()) loadHome(tab) else tab.web.loadUrl(url)
              }

              private fun select(i: Int) {
                  cur = i
                  val t = tabs[i]
                  holder.removeAllViews()
                  (t.web.parent as? ViewGroup)?.removeView(t.web)
                  holder.addView(t.web, FrameLayout.LayoutParams(MATCH, MATCH))
                  urlBar.clearFocus()
                  showUrl(t.web.url)
                  setLoadingUi(t.loading)
                  if (!t.loading) progress.visibility = View.INVISIBLE
                  updateTabsBtn()
                  applyTheme(t)
              }

              private fun closeTab(i: Int) {
                  val t = tabs.removeAt(i)
                  holder.removeView(t.web)
                  if (t.incognito) {
                      t.web.clearCache(true)
                      t.web.clearHistory()
                      t.web.clearFormData()
                  }
                  t.web.destroy()
                  if (tabs.isEmpty()) {
                      newTab(false)
                  } else {
                      val ni = if (i < cur) cur - 1 else minOf(cur, tabs.size - 1)
                      select(ni)
                  }
                  updateTabsBtn()
              }

              private fun handleUrl(uri: Uri): Boolean {
                  val sch = uri.scheme ?: return false
                  if (sch == "azul") {
                      when (uri.host) {
                          "config" -> showSettings()
                          "favs" -> showFavs()
                          "hist" -> showHistory()
                          "downloads" -> showDownloads()
                          "voz" -> startVoice()
                          "news" -> {
                              val nc = uri.getQueryParameter("c")?.toIntOrNull()
                              if (nc != null && nc in newsCats.indices && cur >= 0) {
                                  prefs.edit().putInt("newscat", nc).apply()
                                  val nt = tabs[cur]
                                  pushNews(nt)
                                  loadNews(nt, uri.getQueryParameter("r") == "1" || newsCache[nc] == null)
                              }
                          }
                          "follow" -> {
                              val fs = uri.getQueryParameter("s")
                              if (!fs.isNullOrBlank()) toggleTopic(fs)
                          }
                          "topic" -> showTopicDialog()
                          "search" -> {
                              val sq = uri.getQueryParameter("q")
                              if (!sq.isNullOrBlank() && cur >= 0) runSearch(tabs[cur], sq)
                          }
                          "menu" -> {
                              val mu = uri.getQueryParameter("u")
                              if (!mu.isNullOrBlank() && cur >= 0) linkSheet(mu, false, tabs[cur].incognito)
                          }
                      }
                      return true
                  }
                  if (sch == "http" || sch == "https" || sch == "about" || sch == "data" ||
                      sch == "file" || sch == "javascript" || sch == "blob"
                  ) return false
                  try {
                      val i = if (sch == "intent") Intent.parseUri(uri.toString(), Intent.URI_INTENT_SCHEME)
                      else Intent(Intent.ACTION_VIEW, uri)
                      i.addCategory(Intent.CATEGORY_BROWSABLE)
                      i.component = null
                      i.selector = null
                      startActivity(i)
                  } catch (e: Exception) {
                  }
                  return true
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setup(tab: Tab) {
                  val w = tab.web
                  val s = w.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.setSupportMultipleWindows(true)
                  s.javaScriptCanOpenWindowsAutomatically = true
                  s.builtInZoomControls = true
                  s.displayZoomControls = false
                  s.setSupportZoom(true)
                  s.mediaPlaybackRequiresUserGesture = true
                  s.mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  s.setGeolocationEnabled(true)
                  if (tab.incognito) {
                      s.saveFormData = false
                  }
                  applyMode(tab)
                  applyFast(tab)
                  w.setBackgroundColor(Color.WHITE)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, !tab.incognito)

                  w.setOnLongClickListener {
                      val r = w.hitTestResult
                      val extra = r.extra
                      if (extra == null) {
                          false
                      } else if (r.type == WebView.HitTestResult.SRC_ANCHOR_TYPE ||
                          r.type == WebView.HitTestResult.SRC_IMAGE_ANCHOR_TYPE
                      ) {
                          linkSheet(extra, false, tab.incognito)
                          true
                      } else if (r.type == WebView.HitTestResult.IMAGE_TYPE) {
                          linkSheet(extra, true, tab.incognito)
                          true
                      } else false
                  }

                  w.webViewClient = object : WebViewClient() {
                      override fun onPageStarted(v: WebView?, url: String?, f: Bitmap?) {
                          if (rescueGoogle(tab, url)) return
                          tab.loading = true
                          injectViewport(tab)
                          if (tabs.getOrNull(cur)?.web === v) {
                              showUrl(url)
                              setLoadingUi(true)
                          }
                      }

                      override fun onPageCommitVisible(v: WebView?, url: String?) {
                          injectViewport(tab)
                          styleResults(v, url)
                      }

                      override fun onPageFinished(v: WebView?, url: String?) {
                          tab.loading = false
                          injectViewport(tab)
                          styleResults(v, url)
                          if (tabs.getOrNull(cur)?.web === v) {
                              showUrl(url)
                              setLoadingUi(false)
                          }
                          if (!tab.incognito && v != null && url != null && url.startsWith("http") && !isHome(url) && !isSearch(url)) {
                              addHistory(v.title ?: url, url)
                          }
                      }

                      // Android 7+ usa esta versão
                      override fun shouldOverrideUrlLoading(v: WebView?, r: WebResourceRequest?): Boolean {
                          val u = r?.url ?: return false
                          if (autoTr() && r.isForMainFrame) {
                              val tu = translateUrl(u.toString())
                              if (tu != null) {
                                  v?.post { v?.loadUrl(tu) }
                                  return true
                              }
                          }
                          return handleUrl(u)
                      }

                      // Android 5 e 6 usam esta versão (celulares antigos)
                      @Suppress("OVERRIDE_DEPRECATION", "DEPRECATION")
                      override fun shouldOverrideUrlLoading(v: WebView?, url: String?): Boolean {
                          if (url == null) return false
                          return handleUrl(Uri.parse(url))
                      }

                      override fun onReceivedError(v: WebView?, r: WebResourceRequest?, e: WebResourceError?) {
                          if (r != null && r.isForMainFrame) showError(tab, r.url.toString())
                      }

                      @Suppress("OVERRIDE_DEPRECATION", "DEPRECATION")
                      override fun onReceivedError(v: WebView?, code: Int, desc: String?, failingUrl: String?) {
                          if (Build.VERSION.SDK_INT < 23 && failingUrl != null && failingUrl == v?.url) showError(tab, failingUrl)
                      }

                      override fun onRenderProcessGone(v: WebView?, detail: RenderProcessGoneDetail?): Boolean {
                          v?.post {
                              val i = tabs.indexOfFirst { it.web === v }
                              if (i >= 0) {
                                  toast("A janela travou e foi reiniciada")
                                  closeTab(i)
                              }
                          }
                          return true
                      }
                  }

                  w.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(v: WebView?, p: Int) {
                          if (tabs.getOrNull(cur)?.web === v) setLoadProgress(p)
                      }

                      override fun onCreateWindow(
                          v: WebView?, isDialog: Boolean, isUserGesture: Boolean, msg: Message?
                      ): Boolean {
                          if (msg == null) return false
                          val transport = msg.obj as? WebView.WebViewTransport ?: return false
                          val t = createTab(tab.incognito)
                          t.mode = tab.mode
                          applyMode(t)
                          select(tabs.size - 1)
                          transport.webView = t.web
                          msg.sendToTarget()
                          return true
                      }

                      override fun onCloseWindow(w2: WebView?) {
                          val i = tabs.indexOfFirst { it.web === w2 }
                          if (i >= 0) closeTab(i)
                      }

                      override fun onShowCustomView(view: View?, cb: WebChromeClient.CustomViewCallback?) {
                          if (view == null) return
                          customView = view
                          customCb = cb
                          root.addView(view, FrameLayout.LayoutParams(MATCH, MATCH))
                          main.visibility = View.GONE
                      }

                      override fun onHideCustomView() {
                          hideCustom()
                      }

                      // enviar fotos e arquivos em sites (upload)
                      override fun onShowFileChooser(
                          v: WebView?, cb: ValueCallback<Array<Uri>>?, params: WebChromeClient.FileChooserParams?
                      ): Boolean {
                          fileCb?.onReceiveValue(null)
                          fileCb = cb
                          return try {
                              startActivityForResult(params?.createIntent(), REQ_FILE)
                              true
                          } catch (e: Exception) {
                              fileCb = null
                              cb?.onReceiveValue(null)
                              toast("Não foi possível abrir os arquivos")
                              false
                          }
                      }

                      // câmera e microfone (chamadas de vídeo, gravar áudio)
                      override fun onPermissionRequest(req: PermissionRequest?) {
                          if (req == null) return
                          runOnUiThread { handleWebPerm(req) }
                      }

                      // localização (mapas)
                      override fun onGeolocationPermissionsShowPrompt(
                          origin: String?, cb: GeolocationPermissions.Callback?
                      ) {
                          if (Build.VERSION.SDK_INT < 23 ||
                              checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                          ) {
                              cb?.invoke(origin, true, false)
                          } else {
                              pendingGeoOrigin = origin
                              pendingGeoCb = cb
                              requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION), REQ_GEO)
                          }
                      }
                  }

                  w.setDownloadListener { url, ua, cd, mime, _ -> download(url, ua, cd, mime, tab.incognito) }
              }

              private fun hideCustom() {
                  customView?.let { root.removeView(it) }
                  customCb?.onCustomViewHidden()
                  customView = null
                  customCb = null
                  main.visibility = View.VISIBLE
              }

              private fun grantCapture(req: PermissionRequest) {
                  val ok = req.resources.filter {
                      it == PermissionRequest.RESOURCE_VIDEO_CAPTURE || it == PermissionRequest.RESOURCE_AUDIO_CAPTURE
                  }
                  if (ok.isEmpty()) req.deny() else req.grant(ok.toTypedArray())
              }

              private fun handleWebPerm(req: PermissionRequest) {
                  val need = mutableListOf<String>()
                  for (r in req.resources) {
                      if (r == PermissionRequest.RESOURCE_VIDEO_CAPTURE) need.add(Manifest.permission.CAMERA)
                      if (r == PermissionRequest.RESOURCE_AUDIO_CAPTURE) need.add(Manifest.permission.RECORD_AUDIO)
                  }
                  val missing = need.filter {
                      Build.VERSION.SDK_INT >= 23 && checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isEmpty()) {
                      grantCapture(req)
                  } else {
                      pendingWebPerm = req
                      requestPermissions(missing.toTypedArray(), REQ_PERM)
                  }
              }

              // ---------------------------------------------------------------- modos celular / computador / tablet

              private fun applyMode(tab: Tab) {
                  val s = tab.web.settings
                  when (tab.mode) {
                      1 -> {
                          s.userAgentString = desktopUA
                          s.useWideViewPort = true
                          s.loadWithOverviewMode = true
                      }
                      2 -> {
                          s.userAgentString = tabletUA
                          s.useWideViewPort = true
                          s.loadWithOverviewMode = true
                      }
                      else -> {
                          s.userAgentString = mobileUA
                          s.useWideViewPort = true
                          s.loadWithOverviewMode = false
                      }
                  }
              }

              // força a largura de tela de computador/tablet, mesmo nos sites que mandam layout de celular
              private fun injectViewport(t: Tab) {
                  val w = when (t.mode) {
                      1 -> 1280
                      2 -> 960
                      else -> 0
                  }
                  if (w == 0) return
                  val js = "(function(){try{var h=document.head||document.documentElement;if(!h)return;" +
                      "var m=document.querySelector('meta[name=viewport]');" +
                      "if(!m){m=document.createElement('meta');m.name='viewport';h.appendChild(m);}" +
                      "m.setAttribute('content','width=" + w + "');}catch(e){}})();"
                  try {
                      t.web.evaluateJavascript(js, null)
                  } catch (e: Exception) {
                  }
              }

              private fun applyFast(tab: Tab) {
                  val s = tab.web.settings
                  s.blockNetworkImage = fast
                  s.textZoom = prefs.getInt("zoom", 100)
                  s.cacheMode = when {
                      tab.incognito -> WebSettings.LOAD_NO_CACHE
                      fast -> WebSettings.LOAD_CACHE_ELSE_NETWORK
                      else -> WebSettings.LOAD_DEFAULT
                  }
              }

              private fun reloadTab(t: Tab) {
                  val u = t.web.url
                  val failed = t.failedUrl
                  if (u != null && u.contains("erro.local") && failed != null) t.web.loadUrl(failed)
                  else if (isSearch(u)) runSearch(t, queryOf(u))
                  else if (isHome(u)) loadHome(t)
                  else t.web.reload()
              }

              private val engines = listOf(
                  Pair("DuckDuckGo", "https://html.duckduckgo.com/html/"),
                  Pair("Bing", "https://www.bing.com/search"),
                  Pair("Brave", "https://search.brave.com/search"),
                  Pair("Ecosia", "https://www.ecosia.org/search"),
                  Pair("Google", "https://www.google.com/search")
              )

              private fun engineIdx() = prefs.getInt("engine", 0).coerceIn(0, engines.size - 1)

              private fun searchUrl(q: String) = engines[engineIdx()].second + "?q=" + Uri.encode(q)

              // se o Google mostrar o captcha, refaz a pesquisa no DuckDuckGo
              private fun rescueGoogle(tab: Tab, url: String?): Boolean {
                  if (url == null || !url.contains("google.com/sorry")) return false
                  val cont = Uri.parse(url).getQueryParameter("continue") ?: return false
                  val q = Uri.parse(cont).getQueryParameter("q") ?: return false
                  tab.web.post { tab.web.loadUrl(engines[0].second + "?q=" + Uri.encode(q)) }
                  toast("O Google pediu captcha. Pesquisando no DuckDuckGo.")
                  return true
              }

