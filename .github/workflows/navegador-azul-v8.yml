              private fun go(raw: String) {
                  val q = raw.trim()
                  if (q.isEmpty()) return
                  val isUrl = q.startsWith("http://") || q.startsWith("https://")
                  if (!isUrl && (q.contains(" ") || !q.contains("."))) {
                      runSearch(tabs[cur], q)
                      return
                  }
                  var url = if (isUrl) q else "https://" + q
                  if (autoTr()) url = translateUrl(url) ?: url
                  tabs[cur].query = null
                  tabs[cur].failedUrl = null
                  setLoadProgress(8)
                  tabs[cur].web.loadUrl(url)
              }

