          svg{width:84px;height:84px;animation:pop .5s ease both}
          @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
          h2{margin:18px 0 6px}
          p{margin:0 0 24px;color:#6B7280}
          button{border:0;background:#1E6FEB;color:#fff;font-size:16px;padding:14px 28px;border-radius:28px}
          button:active{transform:scale(.95)}
          </style></head><body>
          <svg viewBox="0 0 24 24" fill="#1E6FEB"><path d="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM13,17h-2v-2h2v2zM13,13h-2L11,7h2v6z"/></svg>
          <h2>Não foi possível abrir a página</h2>
          <p>Verifique sua internet e tente de novo.</p>
          <script>var u=$u;function r(){location.href=u}</script>
          <button onclick="r()">Tentar de novo</button>
          </body></html>"""
                  t.web.loadDataWithBaseURL("https://erro.local/", html, "text/html", "UTF-8", null)
