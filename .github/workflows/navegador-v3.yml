          class Tab(val web: WebView, val incognito: Boolean) {
              // 0 = celular, 1 = computador, 2 = tablet
              var mode = 0
              var loading = false
              var failedUrl: String? = null
          }

          data class Hist(val title: String, val url: String)

          data class Dl(val id: Long, val name: String, val url: String, val time: Long)

          class DlState(val status: Int, val done: Long, val total: Long, val exists: Boolean)

          class PendingDl(val url: String, val ua: String?, val cd: String?, val mime: String?, val incog: Boolean)

          class MainActivity : Activity() {

              private val blue = Color.parseColor("#1E6FEB")
              private val dark = Color.parseColor("#0B3C9E")
              private val light = Color.parseColor("#E8F1FE")
              private val incogColor = Color.parseColor("#37474F")
              private val incogDark = Color.parseColor("#263238")
              private val ink = Color.parseColor("#1F2937")
              private val muted = Color.parseColor("#6B7280")
              private val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              private val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT

              private val REQ_FILE = 21
              private val REQ_PERM = 22
              private val REQ_GEO = 23
              private val REQ_STORAGE = 24

              private val desktopUA =
                  "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
              private val tabletUA =
                  "Mozilla/5.0 (Linux; Android 13; SM-X700) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

              private lateinit var prefs: SharedPreferences
              private lateinit var defaultUA: String
              private lateinit var mobileUA: String
              private lateinit var root: FrameLayout
              private lateinit var main: LinearLayout
              private lateinit var bottomBar: LinearLayout
              private lateinit var urlPill: LinearLayout
              private lateinit var urlBar: EditText
              private lateinit var lockIcon: ImageView
              private lateinit var reloadBtn: ImageView
              private lateinit var progress: ProgressBar
              private lateinit var holder: FrameLayout
              private lateinit var tabsCount: TextView

              private val tabs = mutableListOf<Tab>()
              private var cur = -1
              private var user: String = ""
              private var fast = false
              private var customView: View? = null
              private var customCb: WebChromeClient.CustomViewCallback? = null

              private var fileCb: ValueCallback<Array<Uri>>? = null
              private var pendingWebPerm: PermissionRequest? = null
              private var pendingGeoOrigin: String? = null
              private var pendingGeoCb: GeolocationPermissions.Callback? = null
              private var pendingDl: PendingDl? = null

              // ---------------------------------------------------------------- ciclo de vida

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("nav", MODE_PRIVATE)
                  defaultUA = WebSettings.getDefaultUserAgent(this)
                  // remove as marcas "wv" e "Version/x.x" para os sites tratarem como um navegador de verdade
                  mobileUA = defaultUA.replace("; wv", "").replace(Regex("Version/\\d+\\.\\d+\\s"), "")
                  fast = prefs.getBoolean("fast", false)
                  CookieManager.getInstance().setAcceptCookie(true)
                  root = FrameLayout(this)
                  root.setBackgroundColor(blue)
                  setContentView(root)
                  val f = IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE)
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(dlReceiver, f, Context.RECEIVER_EXPORTED)
                  else registerReceiver(dlReceiver, f)
                  val u = prefs.getString("user", null)
                  if (u.isNullOrBlank()) showLogin() else enter(u)
              }

              override fun onDestroy() {
                  try {
                      unregisterReceiver(dlReceiver)
                  } catch (e: Exception) {
                  }
                  super.onDestroy()
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  val d = intent?.dataString
                  if (!d.isNullOrBlank() && tabs.isNotEmpty()) newTab(false, d)
              }

              override fun onPause() {
                  tabs.forEach { it.web.onPause() }
                  CookieManager.getInstance().flush()
                  super.onPause()
              }

              override fun onResume() {
                  super.onResume()
                  tabs.forEach { it.web.onResume() }
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  if (customView != null) {
                      hideCustom()
                      return
                  }
                  if (cur >= 0 && tabs.isNotEmpty()) {
                      val t = tabs[cur]
                      if (t.web.canGoBack()) {
                          t.web.goBack()
                          return
                      }
                      if (tabs.size > 1) {
                          closeTab(cur)
                          return
                      }
                  }
                  super.onBackPressed()
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_FILE) {
                      fileCb?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data))
                      fileCb = null
                  }
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, res: IntArray) {
                  super.onRequestPermissionsResult(code, perms, res)
                  val ok = res.isNotEmpty() && res.all { it == PackageManager.PERMISSION_GRANTED }
                  if (code == REQ_PERM) {
                      val r = pendingWebPerm
                      pendingWebPerm = null
                      if (r != null) {
                          if (ok) grantCapture(r) else r.deny()
                      }
                  } else if (code == REQ_GEO) {
                      pendingGeoCb?.invoke(pendingGeoOrigin, ok, false)
                      pendingGeoCb = null
                      pendingGeoOrigin = null
                  } else if (code == REQ_STORAGE) {
                      val d = pendingDl
                      pendingDl = null
                      if (d != null) {
                          if (ok) startDownload(d) else toast("Sem permissão para salvar arquivos")
                      }
                  }
              }

              // ---------------------------------------------------------------- helpers de UI

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun round(color: Int, r: Int) = GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = dp(r).toFloat()
              }

              private fun topRound(color: Int, r: Int) = GradientDrawable().apply {
                  setColor(color)
                  val f = dp(r).toFloat()
                  cornerRadii = floatArrayOf(f, f, f, f, 0f, 0f, 0f, 0f)
              }

              private fun lp(w: Int, h: Int, top: Int = 0) =
                  LinearLayout.LayoutParams(w, h).apply { topMargin = dp(top) }

              private fun label(s: String, size: Float, color: Int, bold: Boolean = false): TextView {
                  val t = TextView(this)
                  t.text = s
                  t.textSize = size
                  t.setTextColor(color)
                  t.gravity = Gravity.CENTER
                  if (bold) t.typeface = Typeface.DEFAULT_BOLD
                  return t
              }

              private fun text(s: String, size: Float, color: Int, bold: Boolean = false): TextView {
                  val t = TextView(this)
                  t.text = s
                  t.textSize = size
                  t.setTextColor(color)
                  if (bold) t.typeface = Typeface.DEFAULT_BOLD
                  return t
              }

              private fun icon(res: Int, tint: Int): ImageView {
                  val v = ImageView(this)
                  v.setImageResource(res)
                  v.setColorFilter(tint)
                  v.scaleType = ImageView.ScaleType.CENTER_INSIDE
                  return v
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun pressFx(v: View, to: Float) {
                  v.setOnTouchListener { view, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) {
                          view.animate().scaleX(to).scaleY(to).setDuration(80).start()
                      } else if (e.action == MotionEvent.ACTION_UP || e.action == MotionEvent.ACTION_CANCEL) {
                          view.animate().scaleX(1f).scaleY(1f).setDuration(140).start()
                      }
                      false
                  }
              }

              private fun navBtn(res: Int, desc: String, onClick: () -> Unit): ImageView {
                  val v = icon(res, Color.WHITE)
                  v.setPadding(dp(14), dp(14), dp(14), dp(14))
                  v.contentDescription = desc
                  pressFx(v, 0.8f)
                  v.setOnClickListener { onClick() }
                  return v
              }

              private fun pill(text: String, bg: Int, fg: Int, res: Int?, onClick: () -> Unit): LinearLayout {
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.HORIZONTAL
                  l.gravity = Gravity.CENTER
                  l.background = round(bg, 26)
                  l.setPadding(dp(16), 0, dp(16), 0)
                  if (res != null) {
                      val p = LinearLayout.LayoutParams(dp(20), dp(20))
                      p.rightMargin = dp(8)
                      l.addView(icon(res, fg), p)
                  }
                  l.addView(label(text, 15f, fg, true))
                  pressFx(l, 0.96f)
                  l.setOnClickListener { onClick() }
                  return l
              }

              private fun avatar(name: String, size: Int, bg: Int, fg: Int): TextView {
                  val t = label(name.take(1).uppercase(), (size / 2.4f), fg, true)
                  t.background = round(bg, size / 2)
                  return t
              }

              private fun enterAnim(parent: ViewGroup) {
                  for (i in 0 until parent.childCount) {
                      val c = parent.getChildAt(i)
                      c.alpha = 0f
                      c.translationY = dp(24).toFloat()
                      c.animate().alpha(1f).translationY(0f).setStartDelay(i * 50L).setDuration(300)
                          .setInterpolator(DecelerateInterpolator()).start()
                  }
              }

              private fun hideKb() {
                  val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(urlBar.windowToken, 0)
                  urlBar.clearFocus()
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              private fun setBars(status: Int, nav: Int) {
                  window.statusBarColor = status
                  window.navigationBarColor = nav
              }

              // painel que sobe da parte de baixo (fácil de alcançar com o polegar)
              private fun sheet(build: (LinearLayout, () -> Unit) -> Unit) {
                  val d = Dialog(this, android.R.style.Theme_Material_Light_Dialog_NoActionBar)
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(16), dp(12), dp(16), dp(20))
                  box.background = topRound(Color.WHITE, 24)
                  val handle = View(this)
                  handle.background = round(Color.parseColor("#D1D5DB"), 3)
                  val hp = LinearLayout.LayoutParams(dp(40), dp(5))
                  hp.gravity = Gravity.CENTER_HORIZONTAL
                  hp.bottomMargin = dp(12)
                  box.addView(handle, hp)
                  build(box, { d.dismiss() })
                  val sv = ScrollView(this)
                  sv.addView(box, MATCH, WRAP)
                  d.setContentView(sv)
                  d.setCanceledOnTouchOutside(true)
                  d.window?.let { w ->
                      w.setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT))
                      w.setGravity(Gravity.BOTTOM)
                      w.setLayout(MATCH, WRAP)
                  }
                  d.show()
                  sv.translationY = dp(320).toFloat()
                  sv.animate().translationY(0f).setDuration(220).setInterpolator(DecelerateInterpolator()).start()
              }

              private fun row(res: Int, s: String, trailing: String?, tint: Int, onClick: () -> Unit): LinearLayout {
                  val r = LinearLayout(this)
                  r.orientation = LinearLayout.HORIZONTAL
                  r.gravity = Gravity.CENTER_VERTICAL
                  r.minimumHeight = dp(54)
                  r.setPadding(dp(8), dp(2), dp(8), dp(2))
                  r.addView(icon(res, tint), LinearLayout.LayoutParams(dp(24), dp(24)))
                  val tv = text(s, 16f, ink)
                  tv.setPadding(dp(16), 0, 0, 0)
                  r.addView(tv, LinearLayout.LayoutParams(0, WRAP, 1f))
                  if (trailing != null) {
                      val tr = text(trailing, 12f, dark, true)
                      tr.background = round(light, 12)
                      tr.setPadding(dp(10), dp(4), dp(10), dp(4))
                      r.addView(tr)
                  }
                  pressFx(r, 0.97f)
                  r.setOnClickListener { onClick() }
                  return r
              }

              // ---------------------------------------------------------------- conta

              private fun loadUsers(): List<String> {
                  val out = mutableListOf<String>()
                  try {
                      val arr = JSONArray(prefs.getString("users", "[]"))
                      for (i in 0 until arr.length()) out.add(arr.getString(i))
                  } catch (e: Exception) {
                  }
                  return out
              }

              private fun showLogin() {
                  setBars(dark, dark)
                  root.removeAllViews()
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.gravity = Gravity.CENTER
                  box.setPadding(dp(28), dp(32), dp(28), dp(32))

                  val logo = FrameLayout(this)
                  logo.background = round(Color.WHITE, 48)
                  logo.addView(icon(R.drawable.ic_public, blue), FrameLayout.LayoutParams(dp(56), dp(56), Gravity.CENTER))
                  box.addView(logo, lp(dp(96), dp(96)))
                  box.addView(label("Navegador Azul", 28f, Color.WHITE, true), lp(WRAP, WRAP, 16))
                  box.addView(label("Crie sua conta para começar", 15f, light), lp(WRAP, WRAP, 4))

                  val input = EditText(this)
                  input.hint = "Seu nome"
                  input.textSize = 16f
                  input.setSingleLine()
                  input.setTextColor(ink)
                  input.setHintTextColor(muted)
                  input.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_WORDS
                  input.imeOptions = EditorInfo.IME_ACTION_DONE
                  input.background = round(Color.WHITE, 28)
                  input.setPadding(dp(22), 0, dp(22), 0)
                  input.setOnEditorActionListener { _, action, _ ->
                      if (action == EditorInfo.IME_ACTION_DONE) {
                          login(input.text.toString())
                          true
                      } else false
                  }
                  box.addView(input, lp(MATCH, dp(54), 28))
                  box.addView(pill("Entrar", Color.WHITE, dark, R.drawable.ic_arrow_forward) { login(input.text.toString()) },
                      lp(MATCH, dp(54), 12))

                  val users = loadUsers()
                  if (users.isNotEmpty()) {
                      box.addView(label("ou continue como", 14f, light), lp(WRAP, WRAP, 28))
                      for (n in users) {
                          val r = LinearLayout(this)
                          r.orientation = LinearLayout.HORIZONTAL
                          r.gravity = Gravity.CENTER_VERTICAL
                          r.background = round(Color.argb(46, 255, 255, 255), 28)
                          r.setPadding(dp(8), 0, dp(20), 0)
                          r.addView(avatar(n, 40, Color.WHITE, blue), LinearLayout.LayoutParams(dp(40), dp(40)))
                          val tv = text(n, 16f, Color.WHITE, true)
                          tv.setPadding(dp(14), 0, 0, 0)
                          r.addView(tv)
                          pressFx(r, 0.97f)
                          r.setOnClickListener { login(n) }
                          box.addView(r, lp(MATCH, dp(56), 10))
                      }
                  }

                  val sv = ScrollView(this)
                  sv.isFillViewport = true
                  sv.background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(Color.parseColor("#4C9AFF"), dark))
                  sv.addView(box, MATCH, WRAP)
                  root.addView(sv, MATCH, MATCH)
                  enterAnim(box)
              }

              private fun login(raw: String) {
                  val name = raw.trim()
                  if (name.isEmpty()) {
                      toast("Digite seu nome")
                      return
                  }
                  val us = loadUsers().toMutableList()
                  if (!us.contains(name)) us.add(name)
                  val arr = JSONArray()
                  us.forEach { arr.put(it) }
                  prefs.edit().putString("users", arr.toString()).putString("user", name).apply()
                  enter(name)
              }

              private fun logout() {
                  tabs.forEach {
                      holder.removeView(it.web)
                      it.web.destroy()
                  }
                  tabs.clear()
                  cur = -1
                  histCache = null
                  favCache = null
                  dlCache = null
                  prefs.edit().remove("user").apply()
                  showLogin()
              }

              private fun enter(name: String) {
                  user = name
                  histCache = null
                  favCache = null
                  dlCache = null
                  buildUi()
                  newTab(false, intent?.dataString)
              }

              // ---------------------------------------------------------------- interface do navegador

              private fun buildUi() {
                  root.removeAllViews()
                  tabs.clear()
                  cur = -1

                  main = LinearLayout(this)
                  main.orientation = LinearLayout.VERTICAL
                  main.setBackgroundColor(Color.WHITE)

                  holder = FrameLayout(this)

                  progress = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  progress.max = 100
                  progress.progressTintList = ColorStateList.valueOf(Color.WHITE)
                  progress.progressBackgroundTintList = ColorStateList.valueOf(Color.argb(60, 255, 255, 255))
                  progress.visibility = View.INVISIBLE

                  // barra de endereço fica embaixo: dá pra usar só com o polegar
                  urlBar = EditText(this)
                  urlBar.hint = "Pesquise ou digite o endereço"
                  urlBar.setSingleLine()
                  urlBar.textSize = 15f
                  urlBar.setTextColor(ink)
                  urlBar.setHintTextColor(muted)
                  urlBar.imeOptions = EditorInfo.IME_ACTION_GO
                  urlBar.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
                  urlBar.background = null
                  urlBar.setPadding(dp(10), 0, dp(6), 0)
                  urlBar.setSelectAllOnFocus(true)
                  urlBar.setOnEditorActionListener { _, action, _ ->
                      if (action == EditorInfo.IME_ACTION_GO) {
                          go(urlBar.text.toString())
                          hideKb()
                          true
                      } else false
                  }

                  lockIcon = icon(R.drawable.ic_search, blue)
                  reloadBtn = icon(R.drawable.ic_refresh, blue)
                  reloadBtn.setPadding(dp(11), dp(11), dp(11), dp(11))
                  reloadBtn.contentDescription = "Recarregar"
                  pressFx(reloadBtn, 0.8f)
                  reloadBtn.setOnClickListener {
                      val t = tabs[cur]
                      if (t.loading) {
                          t.web.stopLoading()
                          t.loading = false
                          setLoadingUi(false)
                          progress.visibility = View.INVISIBLE
                      } else {
                          reloadBtn.animate().rotationBy(360f).setDuration(450).start()
                          reloadTab(t)
                      }
                  }

                  urlPill = LinearLayout(this)
                  urlPill.orientation = LinearLayout.HORIZONTAL
                  urlPill.gravity = Gravity.CENTER_VERTICAL
                  urlPill.background = round(Color.WHITE, 26)
                  urlPill.setPadding(dp(16), 0, dp(4), 0)
                  urlPill.addView(lockIcon, LinearLayout.LayoutParams(dp(18), dp(18)))
                  urlPill.addView(urlBar, LinearLayout.LayoutParams(0, dp(48), 1f))
                  urlPill.addView(reloadBtn, LinearLayout.LayoutParams(dp(44), dp(44)))

                  val urlRow = LinearLayout(this)
                  urlRow.orientation = LinearLayout.HORIZONTAL
                  urlRow.setPadding(dp(10), dp(4), dp(10), dp(2))
                  urlRow.addView(urlPill, LinearLayout.LayoutParams(MATCH, dp(48)))

                  val nav = LinearLayout(this)
                  nav.orientation = LinearLayout.HORIZONTAL
                  nav.gravity = Gravity.CENTER_VERTICAL
                  val w = { LinearLayout.LayoutParams(0, dp(52), 1f) }
                  nav.addView(navBtn(R.drawable.ic_arrow_back, "Voltar") {
                      if (tabs[cur].web.canGoBack()) tabs[cur].web.goBack()
                  }, w())
                  nav.addView(navBtn(R.drawable.ic_arrow_forward, "Avançar") {
                      if (tabs[cur].web.canGoForward()) tabs[cur].web.goForward()
                  }, w())
                  nav.addView(navBtn(R.drawable.ic_home, "Início") { loadHome(tabs[cur]) }, w())

                  val tabsBox = FrameLayout(this)
                  tabsBox.contentDescription = "Janelas"
                  tabsBox.addView(icon(R.drawable.ic_tabs, Color.WHITE), FrameLayout.LayoutParams(dp(24), dp(24), Gravity.CENTER))
                  tabsCount = label("1", 11f, Color.WHITE, true)
                  tabsBox.addView(tabsCount, FrameLayout.LayoutParams(dp(24), dp(24), Gravity.CENTER))
                  pressFx(tabsBox, 0.8f)
                  tabsBox.setOnClickListener { showTabs() }
                  nav.addView(tabsBox, w())

                  nav.addView(navBtn(R.drawable.ic_more, "Menu") { showMenu() }, w())

                  bottomBar = LinearLayout(this)
                  bottomBar.orientation = LinearLayout.VERTICAL
                  bottomBar.elevation = dp(8).toFloat()
                  bottomBar.addView(progress, LinearLayout.LayoutParams(MATCH, dp(3)))
                  bottomBar.addView(urlRow, LinearLayout.LayoutParams(MATCH, WRAP))
                  bottomBar.addView(nav, LinearLayout.LayoutParams(MATCH, WRAP))

                  main.addView(holder, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  main.addView(bottomBar, LinearLayout.LayoutParams(MATCH, WRAP))
                  root.addView(main, MATCH, MATCH)
              }

              private fun applyTheme(t: Tab) {
                  val c = if (t.incognito) incogColor else blue
                  val d = if (t.incognito) incogDark else dark
                  bottomBar.setBackgroundColor(c)
                  lockIcon.setColorFilter(c)
                  reloadBtn.setColorFilter(c)
                  setBars(d, c)
              }

              private fun updateTabsBtn() {
                  tabsCount.text = tabs.size.toString()
              }

              private fun setLoadingUi(l: Boolean) {
                  reloadBtn.setImageResource(if (l) R.drawable.ic_close else R.drawable.ic_refresh)
              }

              private fun setProgress(p: Int) {
                  if (p < 100) {
                      progress.visibility = View.VISIBLE
                      ObjectAnimator.ofInt(progress, "progress", p).setDuration(160).start()
                  } else {
                      ObjectAnimator.ofInt(progress, "progress", 100).setDuration(120).start()
                      progress.postDelayed({
                          if (tabs.getOrNull(cur)?.loading != true) {
                              progress.visibility = View.INVISIBLE
                              progress.progress = 0
                          }
                      }, 250)
                  }
              }

              private fun isHome(url: String?) =
                  url == null || url.contains("home.local") || url.contains("erro.local") || url == "about:blank"

              private fun shownUrl(url: String?): String? =
                  if (url != null && url.contains("erro.local")) tabs.getOrNull(cur)?.failedUrl else url

              private fun showUrl(url: String?) {
                  if (urlBar.hasFocus()) return
                  val u = shownUrl(url)
                  urlBar.setText(if (u == null || u.startsWith("data:") || isHome(u)) "" else u)
                  lockIcon.setImageResource(if (u != null && u.startsWith("https")) R.drawable.ic_lock else R.drawable.ic_search)
              }

              // ---------------------------------------------------------------- janelas (abas)

              private fun createTab(incognito: Boolean): Tab {
                  val w = WebView(this)
                  val tab = Tab(w, incognito)
                  setup(tab)
                  tabs.add(tab)
                  updateTabsBtn()
                  return tab
              }

              private fun newTab(incognito: Boolean, url: String? = null) {
                  val tab = createTab(incognito)
                  select(tabs.size - 1)
                  if (url.isNullOrBlank()) loadHome(tab) else tab.web.loadUrl(url)
              }

              private fun select(i: Int) {
                  cur = i
                  val t = tabs[i]
                  holder.removeAllViews()
                  (t.web.parent as? ViewGroup)?.removeView(t.web)
                  holder.addView(t.web, FrameLayout.LayoutParams(MATCH, MATCH))
                  urlBar.clearFocus()
                  showUrl(t.web.url)
                  setLoadingUi(t.loading)
                  if (!t.loading) progress.visibility = View.INVISIBLE
                  updateTabsBtn()
                  applyTheme(t)
              }

              private fun closeTab(i: Int) {
                  val t = tabs.removeAt(i)
                  holder.removeView(t.web)
                  if (t.incognito) {
                      t.web.clearCache(true)
                      t.web.clearHistory()
                      t.web.clearFormData()
                  }
                  t.web.destroy()
                  if (tabs.isEmpty()) {
                      newTab(false)
                  } else {
                      val ni = if (i < cur) cur - 1 else minOf(cur, tabs.size - 1)
                      select(ni)
                  }
                  updateTabsBtn()
              }

              private fun handleUrl(uri: Uri): Boolean {
                  val sch = uri.scheme ?: return false
                  if (sch == "http" || sch == "https" || sch == "about" || sch == "data" ||
                      sch == "file" || sch == "javascript" || sch == "blob"
                  ) return false
                  try {
                      val i = if (sch == "intent") Intent.parseUri(uri.toString(), Intent.URI_INTENT_SCHEME)
                      else Intent(Intent.ACTION_VIEW, uri)
                      i.addCategory(Intent.CATEGORY_BROWSABLE)
                      i.component = null
                      i.selector = null
                      startActivity(i)
                  } catch (e: Exception) {
                  }
                  return true
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setup(tab: Tab) {
                  val w = tab.web
                  val s = w.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.setSupportMultipleWindows(true)
                  s.javaScriptCanOpenWindowsAutomatically = true
                  s.builtInZoomControls = true
                  s.displayZoomControls = false
                  s.setSupportZoom(true)
                  s.mediaPlaybackRequiresUserGesture = true
                  s.mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  s.setGeolocationEnabled(true)
                  if (tab.incognito) {
                      s.saveFormData = false
                  }
                  applyMode(tab)
                  applyFast(tab)
                  w.setBackgroundColor(Color.WHITE)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, !tab.incognito)

                  w.setOnLongClickListener {
                      val r = w.hitTestResult
                      val extra = r.extra
                      if (extra == null) {
                          false
                      } else if (r.type == WebView.HitTestResult.SRC_ANCHOR_TYPE ||
                          r.type == WebView.HitTestResult.SRC_IMAGE_ANCHOR_TYPE
                      ) {
                          linkSheet(extra, false, tab.incognito)
                          true
                      } else if (r.type == WebView.HitTestResult.IMAGE_TYPE) {
                          linkSheet(extra, true, tab.incognito)
                          true
                      } else false
                  }

                  w.webViewClient = object : WebViewClient() {
                      override fun onPageStarted(v: WebView?, url: String?, f: Bitmap?) {
                          tab.loading = true
                          injectViewport(tab)
                          if (tabs.getOrNull(cur)?.web === v) {
                              showUrl(url)
                              setLoadingUi(true)
                          }
                      }

                      override fun onPageCommitVisible(v: WebView?, url: String?) {
                          injectViewport(tab)
                      }

                      override fun onPageFinished(v: WebView?, url: String?) {
                          tab.loading = false
                          injectViewport(tab)
                          if (tabs.getOrNull(cur)?.web === v) {
                              showUrl(url)
                              setLoadingUi(false)
                          }
                          if (!tab.incognito && v != null && url != null && url.startsWith("http") && !isHome(url)) {
                              addHistory(v.title ?: url, url)
                          }
                      }

                      // Android 7+ usa esta versão
                      override fun shouldOverrideUrlLoading(v: WebView?, r: WebResourceRequest?): Boolean {
                          val u = r?.url ?: return false
                          return handleUrl(u)
                      }

                      // Android 5 e 6 usam esta versão (celulares antigos)
                      @Suppress("OVERRIDE_DEPRECATION", "DEPRECATION")
                      override fun shouldOverrideUrlLoading(v: WebView?, url: String?): Boolean {
                          if (url == null) return false
                          return handleUrl(Uri.parse(url))
                      }

                      override fun onReceivedError(v: WebView?, r: WebResourceRequest?, e: WebResourceError?) {
                          if (r != null && r.isForMainFrame) showError(tab, r.url.toString())
                      }

                      @Suppress("OVERRIDE_DEPRECATION", "DEPRECATION")
                      override fun onReceivedError(v: WebView?, code: Int, desc: String?, failingUrl: String?) {
                          if (Build.VERSION.SDK_INT < 23 && failingUrl != null && failingUrl == v?.url) showError(tab, failingUrl)
                      }

                      override fun onRenderProcessGone(v: WebView?, detail: RenderProcessGoneDetail?): Boolean {
                          v?.post {
                              val i = tabs.indexOfFirst { it.web === v }
                              if (i >= 0) {
                                  toast("A janela travou e foi reiniciada")
                                  closeTab(i)
                              }
                          }
                          return true
                      }
                  }

                  w.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(v: WebView?, p: Int) {
                          if (tabs.getOrNull(cur)?.web === v) setProgress(p)
                      }

                      override fun onCreateWindow(
                          v: WebView?, isDialog: Boolean, isUserGesture: Boolean, msg: Message?
                      ): Boolean {
                          if (msg == null) return false
                          val transport = msg.obj as? WebView.WebViewTransport ?: return false
                          val t = createTab(tab.incognito)
                          t.mode = tab.mode
                          applyMode(t)
                          select(tabs.size - 1)
                          transport.webView = t.web
                          msg.sendToTarget()
                          return true
                      }

                      override fun onCloseWindow(w2: WebView?) {
                          val i = tabs.indexOfFirst { it.web === w2 }
                          if (i >= 0) closeTab(i)
                      }

                      override fun onShowCustomView(view: View?, cb: WebChromeClient.CustomViewCallback?) {
                          if (view == null) return
                          customView = view
                          customCb = cb
                          root.addView(view, FrameLayout.LayoutParams(MATCH, MATCH))
                          main.visibility = View.GONE
                      }

                      override fun onHideCustomView() {
                          hideCustom()
                      }

                      // enviar fotos e arquivos em sites (upload)
                      override fun onShowFileChooser(
                          v: WebView?, cb: ValueCallback<Array<Uri>>?, params: WebChromeClient.FileChooserParams?
                      ): Boolean {
                          fileCb?.onReceiveValue(null)
                          fileCb = cb
                          return try {
                              startActivityForResult(params?.createIntent(), REQ_FILE)
                              true
                          } catch (e: Exception) {
                              fileCb = null
                              cb?.onReceiveValue(null)
                              toast("Não foi possível abrir os arquivos")
                              false
                          }
                      }

                      // câmera e microfone (chamadas de vídeo, gravar áudio)
                      override fun onPermissionRequest(req: PermissionRequest?) {
                          if (req == null) return
                          runOnUiThread { handleWebPerm(req) }
                      }

                      // localização (mapas)
                      override fun onGeolocationPermissionsShowPrompt(
                          origin: String?, cb: GeolocationPermissions.Callback?
                      ) {
                          if (Build.VERSION.SDK_INT < 23 ||
                              checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                          ) {
                              cb?.invoke(origin, true, false)
                          } else {
                              pendingGeoOrigin = origin
                              pendingGeoCb = cb
                              requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION), REQ_GEO)
                          }
                      }
                  }

                  w.setDownloadListener { url, ua, cd, mime, _ -> download(url, ua, cd, mime, tab.incognito) }
              }

              private fun hideCustom() {
                  customView?.let { root.removeView(it) }
                  customCb?.onCustomViewHidden()
                  customView = null
                  customCb = null
                  main.visibility = View.VISIBLE
              }

              private fun grantCapture(req: PermissionRequest) {
                  val ok = req.resources.filter {
                      it == PermissionRequest.RESOURCE_VIDEO_CAPTURE || it == PermissionRequest.RESOURCE_AUDIO_CAPTURE
                  }
                  if (ok.isEmpty()) req.deny() else req.grant(ok.toTypedArray())
              }

              private fun handleWebPerm(req: PermissionRequest) {
                  val need = mutableListOf<String>()
                  for (r in req.resources) {
                      if (r == PermissionRequest.RESOURCE_VIDEO_CAPTURE) need.add(Manifest.permission.CAMERA)
                      if (r == PermissionRequest.RESOURCE_AUDIO_CAPTURE) need.add(Manifest.permission.RECORD_AUDIO)
                  }
                  val missing = need.filter {
                      Build.VERSION.SDK_INT >= 23 && checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isEmpty()) {
                      grantCapture(req)
                  } else {
                      pendingWebPerm = req
                      requestPermissions(missing.toTypedArray(), REQ_PERM)
                  }
              }

              // ---------------------------------------------------------------- modos celular / computador / tablet

              private fun applyMode(tab: Tab) {
                  val s = tab.web.settings
                  when (tab.mode) {
                      1 -> {
                          s.userAgentString = desktopUA
                          s.useWideViewPort = true
                          s.loadWithOverviewMode = true
                      }
                      2 -> {
                          s.userAgentString = tabletUA
                          s.useWideViewPort = true
                          s.loadWithOverviewMode = true
                      }
                      else -> {
                          s.userAgentString = mobileUA
                          s.useWideViewPort = true
                          s.loadWithOverviewMode = false
                      }
                  }
              }

              // força a largura de tela de computador/tablet, mesmo nos sites que mandam layout de celular
              private fun injectViewport(t: Tab) {
                  val w = when (t.mode) {
                      1 -> 1280
                      2 -> 960
                      else -> 0
                  }
                  if (w == 0) return
                  val js = "(function(){try{var h=document.head||document.documentElement;if(!h)return;" +
                      "var m=document.querySelector('meta[name=viewport]');" +
                      "if(!m){m=document.createElement('meta');m.name='viewport';h.appendChild(m);}" +
                      "m.setAttribute('content','width=" + w + "');}catch(e){}})();"
                  try {
                      t.web.evaluateJavascript(js, null)
                  } catch (e: Exception) {
                  }
              }

              private fun applyFast(tab: Tab) {
                  val s = tab.web.settings
                  s.blockNetworkImage = fast
                  s.cacheMode = when {
                      tab.incognito -> WebSettings.LOAD_NO_CACHE
                      fast -> WebSettings.LOAD_CACHE_ELSE_NETWORK
                      else -> WebSettings.LOAD_DEFAULT
                  }
              }

              private fun reloadTab(t: Tab) {
                  val u = t.web.url
                  val failed = t.failedUrl
                  if (u != null && u.contains("erro.local") && failed != null) t.web.loadUrl(failed)
                  else if (isHome(u)) loadHome(t)
                  else t.web.reload()
              }

              // ---------------------------------------------------------------- navegação

              private fun go(raw: String) {
                  val q = raw.trim()
                  if (q.isEmpty()) return
                  val url = when {
                      q.startsWith("http://") || q.startsWith("https://") -> q
                      q.contains(" ") || !q.contains(".") -> "https://www.google.com/search?q=" + Uri.encode(q)
                      else -> "https://$q"
                  }
                  tabs[cur].failedUrl = null
                  setProgress(8)
                  tabs[cur].web.loadUrl(url)
              }

              private fun loadHome(tab: Tab) {
                  tab.failedUrl = null
                  tab.web.loadDataWithBaseURL("https://home.local/", homeHtml(tab.incognito), "text/html", "UTF-8", null)
              }

              private fun showError(t: Tab, url: String) {
                  t.failedUrl = url
                  val u = JSONObject.quote(url)
                  val html = """<!DOCTYPE html><html><head><meta charset="utf-8">
